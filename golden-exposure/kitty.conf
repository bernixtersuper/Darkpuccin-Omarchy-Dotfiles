# vim:ft=kitty

## name:     Golden Exposure
## blurb:    Amber gold, burnt orange, warm near-black. Analog warmth.

# The basic colors
foreground              #ffffff
background              #080604
selection_foreground    #080604
selection_background    #f0a010
background_opacity 0.4

# Cursor colors
cursor                  #f0a010
cursor_text_color       #080604
cursor_trail 3
cursor_trail_decay 0.1 0.4

# URL underline color when hovering with mouse
url_color               #2a7870

# Kitty window border colors
active_border_color     #f0a010
inactive_border_color   #2a1a0a
bell_border_color       #e07030

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #080604
active_tab_background   #f0a010
inactive_tab_foreground #7a6a4a
inactive_tab_background #1a1208
tab_bar_background      #080604

# Colors for marks (marked text in the terminal)
mark1_foreground #080604
mark1_background #f0a010
mark2_foreground #080604
mark2_background #2a7870
mark3_foreground #080604
mark3_background #e07030

# The 16 terminal colors

# black
color0 #1a1208
color8 #2a1a0a

# red
color1 #c85018
color9 #c85018

# green
color2  #506028
color10 #506028

# yellow
color3  #f0a010
color11 #f0a010

# blue
color4  #3a4a80
color12 #3a4a80

# magenta
color5  #e07030
color13 #e07030

# cyan
color6  #2a7870
color14 #2a7870

# white
color7  #7a6a4a
color15 #ffffff
