# vim:ft=kitty

## name:     Hatsune Miku
## blurb:    Teal circuits, mint rain, soft pink readouts. Virtual idol, perpetual concert.

# The basic colors
foreground              #ffffff
background              #000000
selection_foreground    #000000
selection_background    #39c5bb
background_opacity 0.4

# Cursor colors
cursor                  #39c5bb
cursor_text_color       #000000
cursor_trail 3
cursor_trail_decay 0.1 0.4

# URL underline color when hovering with mouse
url_color               #72efdd

# Kitty window border colors
active_border_color     #39c5bb
inactive_border_color   #1a3a3a
bell_border_color       #f9a8d4

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #000000
active_tab_background   #39c5bb
inactive_tab_foreground #5a8a88
inactive_tab_background #091414
tab_bar_background      #000000

# Colors for marks (marked text in the terminal)
mark1_foreground #000000
mark1_background #39c5bb
mark2_foreground #000000
mark2_background #72efdd
mark3_foreground #000000
mark3_background #f9a8d4

# The 16 terminal colors

# black
color0 #0d2020
color8 #1a3a3a

# red
color1 #0e7490
color9 #0e7490

# green
color2  #72efdd
color10 #72efdd

# yellow
color3  #f9a8d4
color11 #f9a8d4

# blue
color4  #38bdf8
color12 #38bdf8

# magenta
color5  #39c5bb
color13 #39c5bb

# cyan
color6  #72efdd
color14 #72efdd

# white
color7  #7acdcb
color15 #ffffff
