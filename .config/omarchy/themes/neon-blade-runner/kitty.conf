# vim:ft=kitty

## name:     Neon Blade Runner
## blurb:    Hot pink neon, cyan rain reflections, amber readouts. Perpetual night.

# The basic colors
foreground              #b8c4d0
background              #000000
selection_foreground    #000000
selection_background    #e8609a
background_opacity 0.4

# Cursor colors
cursor                  #e8609a
cursor_text_color       #000000
cursor_trail 3
cursor_trail_decay 0.1 0.4

# URL underline color when hovering with mouse
url_color               #4eb8a8

# Kitty window border colors
active_border_color     #e8609a
inactive_border_color   #2a3a4a
bell_border_color       #d4a040

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #000000
active_tab_background   #e8609a
inactive_tab_foreground #758494
inactive_tab_background #131920
tab_bar_background      #000000

# Colors for marks (marked text in the terminal)
mark1_foreground #000000
mark1_background #e8609a
mark2_foreground #000000
mark2_background #4eb8a8
mark3_foreground #000000
mark3_background #d4a040

# The 16 terminal colors

# black
color0 #1a2330
color8 #2a3a4a

# red
color1 #c85070
color9 #c85070

# green
color2  #4eb8a8
color10 #4eb8a8

# yellow
color3  #d4a040
color11 #d4a040

# blue
color4  #4a8ab8
color12 #4a8ab8

# magenta
color5  #e8609a
color13 #e8609a

# cyan
color6  #4eb8a8
color14 #4eb8a8

# white
color7  #8a9daf
color15 #b8c4d0
