[main]
capslock = layer(nav)

[nav]
# HJKL vim navigation
h = left
j = down
k = up
l = right
# WASD navigation (same layer, same effect)
a = left
s = down
w = up
d = right
# Line/document navigation
leftbrace = home
rightbrace = end
semicolon = pageup
apostrophe = pagedown
slash = delete
